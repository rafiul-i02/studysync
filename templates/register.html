{% extends "base.html" %}
{% block title %}Register — StudySync{% endblock %}
{% block content %}
<div class="card" style="max-width: 440px; margin: 40px auto;">
  <h2>Create Student Account</h2>
  <form method="POST">
    <label>Full Name</label>
    <input type="text" name="name" required placeholder="Your Name">

    <label>Email</label>
    <input type="email" name="email" required placeholder="you@example.com">

    <label>Password (min 6 chars)</label>
    <input type="password" name="password" required minlength="6">

    <label>Daily Study Limit (Hours, e.g. 4)</label>
    <input type="number" step="0.5" min="0.5" max="16" name="daily_study_limit_hours" value="4.0" required>

    <div style="margin-top: 16px;">
      <button type="submit" style="width: 100%;">Register</button>
    </div>
  </form>
  <p style="margin-top: 14px; font-size: 13px;">
    Already registered? <a href="{{ url_for('login') }}">Login here</a>
  </p>
</div>
{% endblock %}
