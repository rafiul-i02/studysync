{% extends "base.html" %}
{% block title %}Login — StudySync{% endblock %}
{% block content %}
<div class="card" style="max-width: 420px; margin: 40px auto;">
  <h2>Login to StudySync</h2>
  <form method="POST">
    <label>Email</label>
    <input type="email" name="email" required placeholder="student@example.com">

    <label>Password</label>
    <input type="password" name="password" required placeholder="Enter password">

    <div style="margin-top: 16px;">
      <button type="submit" style="width: 100%;">Login</button>
    </div>
  </form>
  <p style="margin-top: 14px; font-size: 13px;">
    New student? <a href="{{ url_for('register') }}">Create an account</a>
  </p>
  <p style="font-size: 12px; color: #6b7280;">
    Demo Admin: <code>admin@studysync.local</code> / <code>Admin@123</code>
  </p>
</div>
{% endblock %}
